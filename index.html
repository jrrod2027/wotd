<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Vocabulario del Barrio</title>
    <meta name="description" content="Vocabulario del Barrio — Una Palabra al Día" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=Figtree:ital,wght@0,400;0,600;0,700;1,400&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="engine/styles.css" />
  </head>
  <body>
    <img
      class="site-flags site-flags--pr"
      src="assets/flags/puerto-rico.svg"
      alt="Flag of Puerto Rico"
      width="900"
      height="600"
    />
    <img
      class="site-flags site-flags--dr"
      src="assets/flags/dominican-republic.svg"
      alt="Flag of the Dominican Republic"
      width="900"
      height="600"
    />

    <main class="shell">
      <header class="brand">
        <h1 class="brand__name">Vocabulario del Barrio</h1>
        <p class="brand__tag">Una Palabra al Día</p>
      </header>

      <!-- Brand floats over the gradient; folder is one floating unit -->
      <div class="folder" id="folder">
        <div class="folder__tabs" role="tablist" aria-label="Site sections">
          <button
            type="button"
            class="folder__tab is-active"
            role="tab"
            id="tab-word"
            aria-controls="panel-word"
            aria-selected="true"
            data-tab="word"
          >
            Word of the Day
          </button>
          <button
            type="button"
            class="folder__tab"
            role="tab"
            id="tab-search"
            aria-controls="panel-search"
            aria-selected="false"
            data-tab="search"
            tabindex="-1"
          >
            Search
          </button>
          <button
            type="button"
            class="folder__tab"
            role="tab"
            id="tab-calendar"
            aria-controls="panel-calendar"
            aria-selected="false"
            data-tab="calendar"
            tabindex="-1"
          >
            Calendar
          </button>
        </div>

        <div class="folder__body">
          <p id="status" class="status" role="status">Loading today’s word…</p>

          <section
            id="panel-word"
            class="tab-panel is-active"
            role="tabpanel"
            aria-labelledby="tab-word"
            data-tab-panel="word"
          >
            <nav class="nav-day" aria-label="Day navigation">
              <button
                type="button"
                id="prev-day"
                class="nav-btn"
                aria-label="Previous word day"
                title="Earlier word"
              >
                ←
              </button>
              <div class="nav-day__date">
                <span id="date-label" class="nav-day__label">Word of the day</span>
                <span id="date-value" class="nav-day__value"></span>
              </div>
              <button
                type="button"
                id="next-day"
                class="nav-btn"
                aria-label="Next word day"
                title="Later word"
                disabled
              >
                →
              </button>
            </nav>

            <div class="word-block">
              <h2 id="word" class="word-block__term"></h2>
              <p id="phonetic" class="word-block__phonetic" hidden></p>
              <div id="audio-row" class="audio-row" aria-label="Pronunciations"></div>
            </div>

            <div id="defs" class="defs"></div>
          </section>

          <section
            id="panel-search"
            class="tab-panel"
            role="tabpanel"
            aria-labelledby="tab-search"
            data-tab-panel="search"
            hidden
          >
            <div class="search" id="search">
              <label class="search__label" for="search-input">Search</label>
              <input
                id="search-input"
                class="search__input"
                type="search"
                autocomplete="off"
                spellcheck="false"
                placeholder="Search words, meanings, examples…"
                aria-controls="search-results"
                aria-autocomplete="list"
              />
              <ul id="search-results" class="search__results" role="listbox"></ul>
            </div>
          </section>

          <section
            id="panel-calendar"
            class="tab-panel"
            role="tabpanel"
            aria-labelledby="tab-calendar"
            data-tab-panel="calendar"
            hidden
          >
            <div class="cal" id="calendar">
              <div class="cal__nav">
                <button type="button" id="cal-prev" class="nav-btn" aria-label="Previous month">
                  ←
                </button>
                <h2 id="cal-title" class="cal__title"></h2>
                <button type="button" id="cal-next" class="nav-btn" aria-label="Next month">
                  →
                </button>
              </div>
              <div class="cal__weekdays" aria-hidden="true">
                <span>Sun</span><span>Mon</span><span>Tue</span><span>Wed</span>
                <span>Thu</span><span>Fri</span><span>Sat</span>
              </div>
              <div id="cal-grid" class="cal__grid" role="grid" aria-labelledby="cal-title"></div>
              <p class="cal__hint">
                Only days with a published word (today or earlier) are selectable.
              </p>
            </div>
          </section>
        </div>
      </div>
    </main>

    <script type="module" src="engine/app.js"></script>
  </body>
</html>
